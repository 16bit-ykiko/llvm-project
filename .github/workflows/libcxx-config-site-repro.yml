# CI-only: reproduce the libc++ __config_site lookup with an LLVM release; not for upstream.
name: libcxx-config-site-repro

on:
  push:
    branches: [libcxx-config-site-repro]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: LLVM 23.1.3 for Linux x86_64
        run: |
          curl -fsSL https://github.com/llvm/llvm-project/releases/download/llvmorg-23.1.3/LLVM-23.1.3-Linux-X64.tar.xz \
            | tar -xJ -C $RUNNER_TEMP
          echo "LLVM=$RUNNER_TEMP/LLVM-23.1.3-Linux-X64" >> $GITHUB_ENV
      - name: Where libc++'s headers and __config_site are
        run: |
          cd $LLVM
          ls -d include/c++/v1 include/*/c++/v1
          find include -name __config_site
      - name: A fake macOS SDK with libc++ headers
        run: |
          mkdir -p $RUNNER_TEMP/MacOSX.sdk/usr/include/c++/v1
          touch $RUNNER_TEMP/MacOSX.sdk/usr/include/c++/v1/__config_site
      - name: macOS, with the SDK
        run: |
          set -x
          $LLVM/bin/clang++ -### --target=arm64-apple-macos14 -isysroot $RUNNER_TEMP/MacOSX.sdk \
            -fsyntax-only -x c++ /dev/null 2>&1 | grep -o '"-internal-isystem" "[^"]*c++[^"]*"' || true
          echo '#include <cstddef>' | $LLVM/bin/clang++ --target=arm64-apple-macos14 \
            -isysroot $RUNNER_TEMP/MacOSX.sdk -fsyntax-only -x c++ - || true
      - name: aarch64 Linux, with a sysroot that has libc++
        run: |
          set -x
          mkdir -p $RUNNER_TEMP/sysroot/usr/include/c++/v1
          $LLVM/bin/clang++ -### --target=aarch64-linux-gnu --sysroot=$RUNNER_TEMP/sysroot -stdlib=libc++ \
            -fsyntax-only -x c++ /dev/null 2>&1 | grep -o '"-internal-isystem" "[^"]*c++[^"]*"' || true
          echo '#include <cstddef>' | $LLVM/bin/clang++ --target=aarch64-linux-gnu \
            --sysroot=$RUNNER_TEMP/sysroot -stdlib=libc++ -fsyntax-only -x c++ - || true
